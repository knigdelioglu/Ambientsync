name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/AmbientSync-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "asset=AmbientSync-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; verifying it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Swift 6
        if: steps.existing.outputs.exists != 'true'
        run: |
          swift --version
          swift --version | grep -q "Swift version 6"

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: swift test

      - name: Build DMG
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x build_app.sh scripts/build_release_dmg.sh
          ./scripts/build_release_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Create release notes
        if: steps.existing.outputs.exists != 'true'
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## AmbientSync 1.0.0

          - Samsung S60UD için kabloyu çıkarmadan yazılımsal ekran ayırma/yeniden bağlama eklendi.
          - Son aktif ekranı kapatmama ve mirror-set güvenlik kontrolleri eklendi.
          - Reconnect her denemede güncel private display ID'yi yeniden çözüyor ve üç kez deniyor.
          - Soft-disconnect isteği uyku/uyanma sonrasında korunuyor.
          - Mevcut HiDPI ve DDC recovery akışlarıyla entegrasyon tamamlandı.
          - Swift 6 CI ve doğrulanmış DMG paketleme hattı eklendi.

          ### Dağıtım notu

          DMG Developer ID ile imzalanmış veya Apple tarafından notarize edilmiş değildir. Gatekeeper uyarısı görülebilir. Harici monitör parlaklık/ses kontrolü için `m1ddc` ayrıca gereklidir.
          EOF

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.version.outputs.dmg }}
        run: |
          gh release create "$TAG" "$DMG_PATH#AmbientSync $VERSION DMG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AmbientSync $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify published release and DMG asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == env.TAG and .isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -Fx "$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' \
            | grep -Fx "$ASSET"

      - name: Record verified release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          STATUS_FILE="docs/generated/release_${VERSION//./_}_status.md"
          mkdir -p "$(dirname "$STATUS_FILE")"
          cat > "$STATUS_FILE" <<EOF
          # AmbientSync $VERSION Release Status

          - Tag: $TAG
          - Asset: $ASSET
          - GitHub Release: verified
          - DMG asset: verified
          - Developer ID signed: no
          - Apple notarized: no
          EOF

          if git diff --quiet -- "$STATUS_FILE"; then
            echo "Release status already recorded."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "Record verified AmbientSync $VERSION release"
          git push origin HEAD:main
