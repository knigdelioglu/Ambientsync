name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/AmbientSync-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Swift 6
        if: steps.existing.outputs.exists != 'true'
        run: |
          swift --version
          swift --version | grep -q "Swift version 6"

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: swift test

      - name: Build DMG
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x build_app.sh scripts/build_release_dmg.sh
          ./scripts/build_release_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Create release notes
        if: steps.existing.outputs.exists != 'true'
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## AmbientSync 1.0.0

          - Samsung S60UD için kabloyu çıkarmadan yazılımsal ekran ayırma/yeniden bağlama eklendi.
          - Son aktif ekranı kapatmama ve mirror-set güvenlik kontrolleri eklendi.
          - Reconnect her denemede güncel private display ID'yi yeniden çözüyor ve üç kez deniyor.
          - Soft-disconnect isteği uyku/uyanma sonrasında korunuyor.
          - Mevcut HiDPI ve DDC recovery akışlarıyla entegrasyon tamamlandı.
          - Swift 6 CI ve doğrulanmış DMG paketleme hattı eklendi.

          ### Dağıtım notu

          DMG ad-hoc imzalıdır; Developer ID ile imzalanmış veya Apple tarafından notarize edilmiş değildir. Gatekeeper uyarısı görülebilir. Harici monitör parlaklık/ses kontrolü için `m1ddc` ayrıca gereklidir.
          EOF

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.version.outputs.dmg }}
        run: |
          gh release create "$TAG" "$DMG_PATH#AmbientSync $VERSION DMG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AmbientSync $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
