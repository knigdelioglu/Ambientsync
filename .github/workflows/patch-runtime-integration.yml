name: Patch runtime integration

on:
  push:
    branches:
      - feature/display-soft-disconnect

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: macos-14
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/display-soft-disconnect

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Patch AppDelegate runtime reconciliation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Sources/AmbientSync/App/AppDelegate.swift")
          text = path.read_text()
          marker = "func applySoftwareDisconnectedDisplayStateIfNeeded() -> Bool"
          if marker in text:
              print("Runtime integration already present; nothing to patch.")
              raise SystemExit(0)

          old_tick = '''        refreshSharedRuntimeFeatures()\n\n        guard let reader else {'''
          new_tick = '''        refreshSharedRuntimeFeatures()\n\n        if applySoftwareDisconnectedDisplayStateIfNeeded() {\n            return\n        }\n\n        guard let reader else {'''
          if text.count(old_tick) != 1:
              raise SystemExit(f"Expected exactly one tick insertion point, found {text.count(old_tick)}")
          text = text.replace(old_tick, new_tick, 1)

          old_reload = '''    private func reloadDisplayInfo() async {'''
          helper = '''    func applySoftwareDisconnectedDisplayStateIfNeeded() -> Bool {\n        let connection = displayConnectionController.reconcileDesiredState()\n        guard connection.phase == .softwareDisconnected else { return false }\n\n        currentDisplayInfo = nil\n        currentBrightness = nil\n        currentVolume = nil\n        volumeKeyRouter?.setEnabled(false)\n        availableModes = []\n        isHiDPIActive = false\n        hiDPIStatusText = "Samsung S60UD yazılımsal olarak ayrıldı"\n        currentEDIDSummary = nil\n        hdrBrightnessDiagnosticSummary = nil\n        ddcBrightnessMaxDiagnosticSummary = nil\n        ddcRawBrightnessProbeSummary = nil\n        brightnessMappingDiagnosticSummary = nil\n        clearManualBrightnessOverride()\n        updateVolumeTitle()\n        updateBrightnessState { state in\n            state.isAutoBrightnessEnabled = false\n            state.isBrightnessWriteSuppressed = true\n            state.suppressionReason = "Harici ekran yazılımsal olarak ayrıldı"\n        }\n        updateStatusBarImage(isActive: calibrationSession == nil)\n        updateStatus(connection.message)\n        return true\n    }\n\n    private func reloadDisplayInfo() async {\n        if applySoftwareDisconnectedDisplayStateIfNeeded() {\n            return\n        }'''
          if text.count(old_reload) != 1:
              raise SystemExit(f"Expected exactly one reload insertion point, found {text.count(old_reload)}")
          text = text.replace(old_reload, helper, 1)
          path.write_text(text)
          PY

      - name: Test patched tree
        run: swift test

      - name: Commit runtime integration
        run: |
          if git diff --quiet; then
            echo "No runtime patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/AmbientSync/App/AppDelegate.swift
          git commit -m "Integrate soft-disconnect runtime state"
          git push origin HEAD:feature/display-soft-disconnect
