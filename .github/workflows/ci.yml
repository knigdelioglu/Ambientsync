name: CI

on:
  push:
    branches:
      - main
      - feature/display-soft-disconnect
  pull_request:

jobs:
  swift-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test
