name: CI

on:
  push:
    branches:
      - main
      - feature/display-soft-disconnect
  pull_request:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify Swift 6
        run: |
          swift --version
          swift --version | grep -q "Swift version 6"

      - name: Build and test
        run: swift test
